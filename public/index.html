<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>relay :: terminal chat</title>
<style>
  :root {
    --bg: #050705;
    --bg-raised: #0b100b;
    --green: #3dff77;
    --green-dim: #1f8f47;
    --green-dimmer: #145c2e;
    --amber: #ffb84d;
    --red: #ff5f5f;
    --border: #123320;
    --palette-1: #3dff77;
    --palette-2: #5fffa8;
    --palette-3: #26c766;
    --palette-4: #8affc1;
    --palette-5: #2fae5e;
    --palette-6: #7dffb0;
    --palette-7: #40e88a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--green);
    font-family: ui-monospace, "Cascadia Code", "SF Mono", "Consolas", "Liberation Mono", Menlo, monospace;
    font-size: 15px;
    overflow: hidden;
  }

  #screen {
    position: relative;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  /* ---------- CRT overlay effects ---------- */
  .crt-scanlines {
    pointer-events: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0) 0px,
      rgba(0, 0, 0, 0) 1px,
      rgba(0, 0, 0, 0.18) 2px,
      rgba(0, 0, 0, 0.18) 3px
    );
    mix-blend-mode: multiply;
    animation: scan-drift 9s linear infinite;
  }
  @keyframes scan-drift {
    0% { background-position: 0 0; }
    100% { background-position: 0 40px; }
  }
  .crt-vignette {
    pointer-events: none;
    position: fixed;
    inset: 0;
    z-index: 51;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
  }
  @media (prefers-reduced-motion: reduce) {
    .crt-scanlines { animation: none; }
  }

  .glow {
    text-shadow: 0 0 2px rgba(61,255,119,0.5), 0 0 8px rgba(61,255,119,0.25);
  }

  ::selection { background: var(--green-dim); color: #000; }

  a { color: var(--green); }

  /* ---------- Boot screen ---------- */
  #boot-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 24px;
    z-index: 10;
    background: var(--bg);
  }
  #boot-lines {
    white-space: pre-wrap;
    line-height: 1.5;
  }
  #boot-cursor {
    display: inline-block;
    width: 0.6em;
    background: var(--green);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    #boot-cursor { animation: none; }
  }
  #boot-skip {
    position: absolute;
    bottom: 16px;
    right: 20px;
    color: var(--green-dim);
    font-size: 12px;
  }

  /* ---------- Gate screen ---------- */
  #gate-screen {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    background: var(--bg);
    padding: 20px;
  }
  #gate-screen.visible { display: flex; }
  .gate-box {
    width: 100%;
    max-width: 460px;
    border: 1px solid var(--border);
    padding: 24px;
    background: var(--bg-raised);
    box-shadow: 0 0 24px rgba(61,255,119,0.08);
  }
  .gate-box h1 {
    font-size: 15px;
    margin: 0 0 16px;
    font-weight: normal;
  }
  .gate-row {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--green-dimmer);
    padding: 10px 12px;
    background: #000;
  }
  .gate-row span { color: var(--green-dim); white-space: nowrap; }
  #handle-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--green);
    font: inherit;
    caret-color: var(--green);
  }
  .gate-hint {
    margin-top: 10px;
    font-size: 12px;
    color: var(--green-dim);
    min-height: 16px;
  }
  .gate-hint.error { color: var(--red); }
  .gate-submit {
    margin-top: 14px;
    background: transparent;
    border: 1px solid var(--green-dim);
    color: var(--green);
    font: inherit;
    padding: 8px 14px;
    cursor: pointer;
  }
  .gate-submit:hover { background: rgba(61,255,119,0.08); }

  /* ---------- Intro video screen ---------- */
  #video-screen {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 11;
    background: #000;
    padding: 20px;
  }
  #video-screen.visible { display: flex; }
  .video-box {
    width: 100%;
    max-width: 800px;
    border: 1px solid var(--border);
    background: #000;
    box-shadow: 0 0 24px rgba(61,255,119,0.08);
  }
  #intro-video {
    display: block;
    width: 100%;
    max-height: 70vh;
    background: #000;
  }
  #video-skip {
    text-align: right;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--green-dim);
    cursor: pointer;
    border-top: 1px solid var(--border);
  }
  #video-skip:hover { color: var(--green); }

  /* ---------- App screen ---------- */
  #app {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    z-index: 5;
  }
  #app.visible { display: flex; }

  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-raised);
    font-size: 13px;
    flex-shrink: 0;
  }
  #header .brand { color: var(--green); }
  #header .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green-dim);
    margin-right: 6px;
  }
  #header .status-dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
  #header .status-dot.offline { background: var(--red); box-shadow: none; }
  #header-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  #online-count {
    cursor: pointer;
    color: var(--green-dim);
    border: 1px solid var(--green-dimmer);
    padding: 3px 8px;
  }
  #online-count:hover { color: var(--green); }

  #main {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  #log-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
    line-height: 1.5;
  }
  .line { white-space: pre-wrap; word-break: break-word; margin-bottom: 2px; }
  .line .ts { color: var(--green-dimmer); }
  .line .handle { font-weight: bold; }
  .line.system { color: var(--green-dimmer); font-style: italic; }
  .line.error { color: var(--red); }
  .line.action { font-style: italic; }
  .line.self .handle { text-decoration: underline; }

  #sidebar {
    width: 190px;
    border-left: 1px solid var(--border);
    background: var(--bg-raised);
    padding: 10px 12px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  #sidebar h2 {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--green-dim);
    margin: 0 0 8px;
    font-weight: normal;
  }
  #user-list { list-style: none; margin: 0; padding: 0; }
  #user-list li { padding: 3px 0; font-size: 13px; }

  #input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    border-top: 1px solid var(--border);
    padding: 8px 14px;
    background: var(--bg-raised);
    flex-shrink: 0;
  }
  #prompt-label { color: var(--green); white-space: nowrap; }
  #msg-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--green);
    font: inherit;
    caret-color: var(--green);
  }
  #char-count { color: var(--green-dimmer); font-size: 11px; white-space: nowrap; }

  /* Mobile: sidebar becomes an overlay panel toggled by tapping online count */
  @media (max-width: 720px) {
    #sidebar {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      transform: translateX(100%);
      transition: transform 0.2s ease;
      z-index: 20;
      box-shadow: -6px 0 18px rgba(0,0,0,0.5);
    }
    #sidebar.open { transform: translateX(0); }
    @media (prefers-reduced-motion: reduce) {
      #sidebar { transition: none; }
    }
  }

  .hidden { display: none !important; }

  #log::-webkit-scrollbar, #sidebar::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb, #sidebar::-webkit-scrollbar-thumb { background: var(--green-dimmer); }
  #log::-webkit-scrollbar-track, #sidebar::-webkit-scrollbar-track { background: var(--bg); }
</style>
</head>
<body>
<div id="screen" class="glow">
  <div class="crt-scanlines"></div>
  <div class="crt-vignette"></div>

  <div id="boot-screen">
    <div id="boot-lines"></div>
    <div id="boot-skip">press any key to skip</div>
  </div>

  <div id="gate-screen">
    <div class="gate-box">
      <h1>&gt; enter a handle to join the relay</h1>
      <div class="gate-row">
        <span>handle:</span>
        <input id="handle-input" type="text" maxlength="16" autocomplete="off" spellcheck="false" placeholder="e.g. ghost_01">
      </div>
      <div class="gate-hint" id="gate-hint">1-16 chars: letters, numbers, _ . -</div>
      <button class="gate-submit" id="gate-submit">connect &gt;</button>
    </div>
  </div>

  <div id="video-screen">
    <div class="video-box">
      <video id="intro-video" src="intro.mp4" playsinline></video>
      <div id="video-skip">skip &gt;&gt;</div>
    </div>
  </div>

  <div id="app">
    <div id="header">
      <div class="brand"><span class="status-dot" id="status-dot"></span><span id="status-text">connecting...</span></div>
      <div id="header-right">
        <div id="online-count">online: <span id="online-num">0</span></div>
      </div>
    </div>
    <div id="main">
      <div id="log-pane">
        <div id="log"></div>
        <div id="input-row">
          <span id="prompt-label"></span>
          <input id="msg-input" type="text" maxlength="300" autocomplete="off" spellcheck="false">
          <span id="char-count">300</span>
        </div>
      </div>
      <div id="sidebar">
        <h2>online (<span id="sidebar-count">0</span>)</h2>
        <ul id="user-list"></ul>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var HANDLE_RE = /^[A-Za-z0-9_.-]{1,16}$/;
  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------------- Boot sequence ----------------
  var bootLinesEl = document.getElementById('boot-lines');
  var bootScreen = document.getElementById('boot-screen');
  var gateScreen = document.getElementById('gate-screen');
  var bootSkip = document.getElementById('boot-skip');

  var BOOT_TEXT = [
    'RELAY TERMINAL v1.0',
    'establishing uplink to relay host ...... OK',
    'negotiating socket protocol ............ OK',
    'loading terminal driver ................ OK',
    'no accounts. no database. one shared room.',
    ''
  ].join('\n');

  var bootDone = false;

  function showGate() {
    if (bootDone) return;
    bootDone = true;
    bootScreen.classList.add('hidden');
    gateScreen.classList.add('visible');
    document.getElementById('handle-input').focus();
  }

  function runBoot() {
    if (reducedMotion) {
      bootLinesEl.textContent = BOOT_TEXT;
      setTimeout(showGate, 300);
      return;
    }
    var i = 0;
    var speed = 12; // ms per char
    function tick() {
      if (bootDone) return;
      if (i <= BOOT_TEXT.length) {
        bootLinesEl.textContent = BOOT_TEXT.slice(0, i);
        i++;
        setTimeout(tick, speed);
      } else {
        setTimeout(showGate, 500);
      }
    }
    tick();
  }

  document.addEventListener('keydown', showGate, { once: false });
  bootScreen.addEventListener('click', showGate);
  bootSkip.addEventListener('click', showGate);

  runBoot();

  // ---------------- Handle gate ----------------
  var handleInput = document.getElementById('handle-input');
  var gateHint = document.getElementById('gate-hint');
  var gateSubmit = document.getElementById('gate-submit');
  var appEl = document.getElementById('app');

  var myHandle = null;
  var socket = null;

  // ---------------- One-time intro video ----------------
  var INTRO_KEY = 'relay_intro_seen_v1';
  var videoScreen = document.getElementById('video-screen');
  var introVideo = document.getElementById('intro-video');
  var videoSkip = document.getElementById('video-skip');
  var introActive = false;
  var joinReady = false; // true once the server has confirmed 'joined' while intro is still playing

  function showApp() {
    promptLabel.textContent = myHandle + '@relay:~$';
    gateScreen.classList.remove('visible');
    videoScreen.classList.remove('visible');
    appEl.classList.add('visible');
    setStatus('online');
    msgInput.focus();
  }

  function finishIntro() {
    if (!introActive) return;
    introActive = false;
    try { localStorage.setItem(INTRO_KEY, '1'); } catch (e) {}
    introVideo.pause();
    videoScreen.classList.remove('visible');
    if (joinReady) {
      showApp();
    } else {
      gateScreen.classList.add('visible');
      gateHint.textContent = 'connecting...';
    }
  }

  function abortIntro() {
    introActive = false;
    introVideo.pause();
    videoScreen.classList.remove('visible');
  }

  function playIntro() {
    introActive = true;
    joinReady = false;
    gateScreen.classList.remove('visible');
    videoScreen.classList.add('visible');
    introVideo.currentTime = 0;
    var p = introVideo.play();
    if (p && typeof p.catch === 'function') p.catch(finishIntro);
  }

  introVideo.addEventListener('ended', finishIntro);
  introVideo.addEventListener('error', finishIntro);
  videoSkip.addEventListener('click', finishIntro);

  function attemptJoin() {
    var val = handleInput.value.trim();
    if (!HANDLE_RE.test(val)) {
      gateHint.textContent = 'invalid handle: 1-16 chars, letters/numbers/_.- only';
      gateHint.classList.add('error');
      return;
    }
    gateHint.classList.remove('error');
    gateHint.textContent = 'connecting...';
    myHandle = val;

    var seenIntro = false;
    try { seenIntro = !!localStorage.getItem(INTRO_KEY); } catch (e) {}
    if (!seenIntro) playIntro();

    connect(val);
  }

  gateSubmit.addEventListener('click', attemptJoin);
  handleInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') attemptJoin();
  });

  // ---------------- Chat app state ----------------
  var logEl = document.getElementById('log');
  var userListEl = document.getElementById('user-list');
  var onlineNumEl = document.getElementById('online-num');
  var sidebarCountEl = document.getElementById('sidebar-count');
  var statusDot = document.getElementById('status-dot');
  var statusText = document.getElementById('status-text');
  var msgInput = document.getElementById('msg-input');
  var promptLabel = document.getElementById('prompt-label');
  var charCount = document.getElementById('char-count');
  var sidebar = document.getElementById('sidebar');
  var onlineCountBtn = document.getElementById('online-count');

  var reconnectAttempts = 0;
  var reconnectTimer = null;
  var intentionalClose = false;

  function wsUrl() {
    var proto = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    return proto + window.location.host;
  }

  function setStatus(state) {
    statusDot.className = 'status-dot ' + state;
    if (state === 'online') statusText.textContent = 'connected';
    else if (state === 'offline') statusText.textContent = 'disconnected';
    else statusText.textContent = 'reconnecting...';
  }

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function tsFormat(ms) {
    var d = new Date(ms);
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  }

  // Hash a handle into a small palette of greens.
  var PALETTE = ['--palette-1', '--palette-2', '--palette-3', '--palette-4', '--palette-5', '--palette-6', '--palette-7'];
  function colorFor(handle) {
    var h = 0;
    for (var i = 0; i < handle.length; i++) {
      h = (h * 31 + handle.charCodeAt(i)) >>> 0;
    }
    var varName = PALETTE[h % PALETTE.length];
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  }

  function isAtBottom() {
    return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
  }

  function appendLine(node) {
    var stick = isAtBottom();
    logEl.appendChild(node);
    if (stick) logEl.scrollTop = logEl.scrollHeight;
  }

  function makeLine(className) {
    var div = document.createElement('div');
    div.className = 'line ' + className;
    return div;
  }

  function renderChat(entry) {
    var div = makeLine('chat' + (entry.action ? ' action' : '') + (entry.handle === myHandle ? ' self' : ''));
    var ts = document.createElement('span');
    ts.className = 'ts';
    ts.textContent = '[' + tsFormat(entry.ts) + '] ';
    div.appendChild(ts);

    if (entry.action) {
      var star = document.createTextNode('* ');
      div.appendChild(star);
      var h = document.createElement('span');
      h.className = 'handle';
      h.style.color = colorFor(entry.handle);
      h.textContent = entry.handle;
      div.appendChild(h);
      div.appendChild(document.createTextNode(' ' + entry.text));
    } else {
      var h2 = document.createElement('span');
      h2.className = 'handle';
      h2.style.color = colorFor(entry.handle);
      h2.textContent = '<' + entry.handle + '>';
      div.appendChild(h2);
      div.appendChild(document.createTextNode(' ' + entry.text));
    }
    appendLine(div);
  }

  function renderSystem(entry, isError) {
    var div = makeLine(isError ? 'error' : 'system');
    var ts = document.createElement('span');
    ts.className = 'ts';
    ts.textContent = '[' + tsFormat(entry.ts || Date.now()) + '] ';
    div.appendChild(ts);
    div.appendChild(document.createTextNode('-- ' + entry.text));
    appendLine(div);
  }

  function renderHistory(messages) {
    messages.forEach(function (entry) {
      if (entry.type === 'chat') renderChat(entry);
      else if (entry.type === 'system') renderSystem(entry, false);
    });
  }

  function updatePresence(users) {
    onlineNumEl.textContent = users.length;
    sidebarCountEl.textContent = users.length;
    userListEl.innerHTML = '';
    users.forEach(function (u) {
      var li = document.createElement('li');
      li.style.color = colorFor(u);
      li.textContent = u === myHandle ? u + ' (you)' : u;
      userListEl.appendChild(li);
    });
  }

  function localSystemLine(text) {
    renderSystem({ text: text, ts: Date.now() }, false);
  }

  var HELP_TEXT = [
    'commands:',
    '  /me <action>      describe an action',
    '  /nick <handle>    change your handle',
    '  /who              list online users',
    '  /clear            clear the screen',
    '  /help             show this help'
  ].join('\n');

  function handleCommand(raw) {
    var parts = raw.slice(1).split(' ');
    var cmd = parts[0].toLowerCase();
    var rest = raw.slice(raw.indexOf(' ') + 1);
    if (raw.indexOf(' ') === -1) rest = '';

    if (cmd === 'help') {
      localSystemLine(HELP_TEXT);
      return;
    }
    if (cmd === 'clear') {
      logEl.innerHTML = '';
      return;
    }
    if (cmd === 'who') {
      var users = Array.from(userListEl.children).map(function (li) { return li.textContent; });
      localSystemLine('online: ' + users.join(', '));
      return;
    }
    if (cmd === 'nick') {
      if (!HANDLE_RE.test(rest)) {
        localSystemLine('invalid handle: 1-16 chars, letters/numbers/_.- only');
        return;
      }
      sendJSON({ type: 'nick', handle: rest });
      return;
    }
    if (cmd === 'me') {
      if (!rest) return;
      sendJSON({ type: 'chat', text: rest, action: true });
      return;
    }
    localSystemLine('unknown command: /' + cmd + ' (try /help)');
  }

  function sendJSON(obj) {
    if (socket && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify(obj));
    }
  }

  msgInput.addEventListener('input', function () {
    charCount.textContent = 300 - msgInput.value.length;
  });

  msgInput.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var val = msgInput.value;
    if (!val) return;
    msgInput.value = '';
    charCount.textContent = '300';
    if (val.charAt(0) === '/') {
      handleCommand(val);
    } else {
      sendJSON({ type: 'chat', text: val, action: false });
    }
  });

  onlineCountBtn.addEventListener('click', function () {
    sidebar.classList.toggle('open');
  });

  function connect(handle) {
    setStatus('connecting');
    socket = new WebSocket(wsUrl());

    socket.addEventListener('open', function () {
      sendJSON({ type: 'join', handle: handle });
    });

    socket.addEventListener('message', function (ev) {
      var entry;
      try {
        entry = JSON.parse(ev.data);
      } catch (e) {
        return;
      }

      if (entry.type === 'joined') {
        myHandle = entry.handle;
        reconnectAttempts = 0;
        if (introActive) {
          joinReady = true;
        } else {
          showApp();
        }
        return;
      }
      if (entry.type === 'error') {
        if (!appEl.classList.contains('visible')) {
          if (introActive) abortIntro();
          gateScreen.classList.add('visible');
          gateHint.textContent = entry.text;
          gateHint.classList.add('error');
        } else {
          renderSystem(entry, true);
        }
        return;
      }
      if (entry.type === 'history') {
        renderHistory(entry.messages);
        return;
      }
      if (entry.type === 'chat') {
        renderChat(entry);
        return;
      }
      if (entry.type === 'system') {
        renderSystem(entry, false);
        return;
      }
      if (entry.type === 'presence') {
        updatePresence(entry.users);
        return;
      }
    });

    socket.addEventListener('close', function () {
      setStatus('offline');
      if (appEl.classList.contains('visible')) {
        localSystemLine('connection lost. reconnecting...');
      }
      scheduleReconnect();
    });

    socket.addEventListener('error', function () {
      socket.close();
    });
  }

  function scheduleReconnect() {
    if (intentionalClose) return;
    reconnectAttempts++;
    var delay = Math.min(1000 * Math.pow(2, reconnectAttempts - 1), 15000);
    setStatus('reconnecting');
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(function () {
      if (myHandle) connect(myHandle);
    }, delay);
  }

  window.addEventListener('beforeunload', function () {
    intentionalClose = true;
  });
})();
</script>
